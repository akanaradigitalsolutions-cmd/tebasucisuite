name: Theme checks

# Runs on every push and pull request: catches PHP syntax errors before they
# can reach the live site, and builds an installable theme zip.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Validate theme.json
        run: php -r 'json_decode(file_get_contents("theme.json"), false, 512, JSON_THROW_ON_ERROR); echo "theme.json OK\n";'

  package:
    name: Build theme zip
    needs: php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tebasuci.zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=tebasuci/ -o dist/tebasuci.zip HEAD
          unzip -l dist/tebasuci.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: tebasuci-theme
          path: dist/tebasuci.zip
          retention-days: 30
